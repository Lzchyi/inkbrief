# KT5 portrait geometry and safety bounds. Values are sourced only from this
# package-owned file and validated by dashboard.sh.
screen_width=1072
screen_height=1448
max_runtime=1800
home_width=180
home_height=110
corner_hold_ms=3000

# Populate these only after running the read-only touch probe on the device.
touch_device=
touch_swap_axes=0
touch_invert_x=0
touch_invert_y=0
