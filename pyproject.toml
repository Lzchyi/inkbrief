[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-brief"
version = "0.1.0"
description = "A server-rendered, e-ink dashboard for a jailbroken Kindle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kindle Brief contributors" }]
dependencies = [
  "astronomy-engine>=2.1,<3",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "lunar-python>=1.4.7,<2",
  "Pillow>=10.4,<13",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
kindle-brief = "kindle_brief.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
