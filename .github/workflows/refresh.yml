name: Refresh dashboard

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: backend
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AI_PROVIDER: auto
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Restore last-success source cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/kindle-brief
          key: >-
            kindle-brief-live-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kindle-brief-live-v1-${{ github.ref_name }}-

      - name: Validate configuration
        run: >-
          python -m kindle_brief.cli validate
          --config config/config.example.yaml
          --feeds config/feeds.yaml

      - name: Build live release
        run: >-
          python -m kindle_brief.cli build
          --config config/config.example.yaml
          --feeds config/feeds.yaml
          --cache .cache/kindle-brief
          --output public
          --live

      - name: Verify Pages root
        run: |
          test -s public/profiles/kt5/current.json
          if find public -type l -print -quit | grep -q .; then
            echo "Refusing a Pages artifact containing symlinks" >&2
            exit 1
          fi

      - name: Save successful source cache
        uses: actions/cache/save@v5
        with:
          path: .cache/kindle-brief
          key: >-
            kindle-brief-live-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
